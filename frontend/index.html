<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding for the document -->
    <meta charset="UTF-8" />
    <!-- Default Vite favicon (not yet replaced with a custom app icon) -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Ensures proper scaling/rendering on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Browser tab title (still the default Vite scaffold title, not yet customized
         e.g. to something like "Job Portal") -->
    <title>Vite + React</title>
  </head>
  <body>
    <!-- React app mounts here (see main.jsx, which targets this #root element) -->
    <div id="root"></div>
    <!-- Loads the app's entry script as an ES module (Vite dev/build handles bundling) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
